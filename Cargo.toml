[package]
name = "snapcast-multiroom"
version = "0.2.0"
edition = "2024"
resolver = "3"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snapcast-control = { version = "*", path = "./snapcast-control" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
